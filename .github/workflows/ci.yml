name: Institutional Reasoning Engine CI

on:
  push:
    branches: [ "main", "feat/*" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  backend-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.12"
        cache: "pip"
        
    - name: Install dependencies
      run: |
        pip install --require-hashes -r requirements.txt
        pip check

    - name: Verify software bill of materials
      run: |
        python tools/generate_sbom.py --requirements requirements.txt --output sbom.cdx.json
        git diff --exit-code -- sbom.cdx.json
        
    - name: Banned Words Check (Domain Leakage)
      run: bash ./tools/banned_words_check.sh
      
    - name: Type checking with MyPy
      run: python -m mypy --explicit-package-bases app tests/assurance tests/integration

    - name: Verify Alembic migrations from a fresh database
      run: DATABASE_URL="sqlite+aiosqlite:///${RUNNER_TEMP}/ire-migration-check.db" python -m alembic upgrade head
      
    - name: Run Pytest
      run: python -m pytest tests/ -q

  assurance-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.12"
        cache: "pip"

    - name: Install locked dependencies
      run: |
        pip install --require-hashes -r requirements.txt
        pip check

    - name: Produce Enterprise Safety Baseline evidence
      run: python -m pytest tests/assurance -q --junitxml=assurance-baseline.xml

    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      if: ${{ !cancelled() }}
      with:
        name: enterprise-safety-baseline
        path: assurance-baseline.xml
        retention-days: 90

  frontend-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ./frontend
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    
    - name: Set up Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 20
        cache: 'npm'
        cache-dependency-path: './frontend/package-lock.json'
        
    - name: Install dependencies
      run: npm ci

    - name: Audit production dependencies
      run: npm audit --omit=dev --audit-level=high
      
    - name: Lint
      run: npm run lint

    - name: Type checking and Build
      run: npm run build
      
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
      
    - name: Run Playwright tests
      run: npm run test:e2e
      
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: frontend/playwright-report/
        retention-days: 14

  container-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Build locked application container
      run: docker build --pull=false --tag institutional-reasoning-engine:${{ github.sha }} .

  postgres-rls-rehearsal:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:15-alpine@sha256:3d0f7584ed7d04e27fa050d6683a74746608faf21f202be78460d679cc56461f
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ire_rls_rehearsal
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ire_rls_rehearsal"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      IRE_RLS_ALLOW_DESTRUCTIVE_REHEARSAL: confirmed
      IRE_RLS_BOOTSTRAP_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/ire_rls_rehearsal
      IRE_RLS_MIGRATOR_URL: postgresql+asyncpg://ire_migrator_rehearsal:migrator-rehearsal-password@127.0.0.1:5432/ire_rls_rehearsal
      IRE_RLS_APP_URL: postgresql+asyncpg://ire_app_rehearsal:app-rehearsal-password@127.0.0.1:5432/ire_rls_rehearsal
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.12"
        cache: "pip"

    - name: Install dependencies
      run: |
        pip install --require-hashes -r requirements.txt
        pip check

    - name: Rehearse PostgreSQL tenant isolation
      run: python tools/run_postgres_rls_rehearsal.py --no-compose
